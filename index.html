<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Table Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
      }
      .input-section {
        margin-bottom: 20px;
      }
      .input-section label {
        font-weight: bold;
        margin-right: 5px;
      }
      .input-section input {
        width: 80px;
        padding: 6px;
        margin-right: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .input-section button {
        padding: 7px 15px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .input-section button:hover {
        background-color: #218838;
      }

    
      table {
        border-collapse: collapse;
        margin-top: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      td {
        border: 2px solid #444;
        width: 50px;
        height: 50px;
        text-align: center;
        vertical-align: middle;
        background-color: #fafafa;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <input type="number" id="rows" placeholder="row number.." />
    <input type="number" id="columns" placeholder="colum number" />

    <button onclick="generateGrid()">Generate Grid</button>

    <div id="gridContainer"></div>

    <script> 

function generateGrid(){
const rowValue = parseInt(document.getElementById("rows").value);
const colValue = parseInt(document.getElementById("columns").value);

const container = document.getElementById("gridContainer");

container.innerText ='';

if(!rowValue || !colValue ){
    alert("Please enter values!");
    return;
}
const table = document.createElement('table');
table.setAttribute('border', '1');

for(let r=1; r <= rowValue; r++){
    const tr = document.createElement('tr');
    for(let c = 1; c <= colValue; c++) {
        const td = document.createElement('td');
        td.innerText = `${r}-${c}`;
        tr.appendChild(td);
    }

    table.appendChild(tr);    
    }
   container.appendChild(table); 
}

    </script>
  </body>
</html>
